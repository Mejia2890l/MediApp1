<ion-header>
  <ion-toolbar color="warning">
    <ion-title>Cambiar contraseña</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-item>
    <ion-label position="floating">Nueva contraseña</ion-label>
    <ion-input type="password" [(ngModel)]="nuevaPassword"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="floating">Confirmar contraseña</ion-label>
    <ion-input type="password" [(ngModel)]="confirmarPassword"></ion-input>
  </ion-item>

  <ion-button expand="block" (click)="cambiar()">Guardar nueva contraseña</ion-button>

  <ion-text color="danger" *ngIf="mensaje">{{ mensaje }}</ion-text>
</ion-content>
