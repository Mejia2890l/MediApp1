<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Registrar medidor</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-item>
    <ion-label position="floating">Nombre del titular</ion-label>
    <ion-input [(ngModel)]="nombre"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="floating">Número de contacto</ion-label>
    <ion-input [(ngModel)]="contacto"></ion-input>
  </ion-item>

  <ion-item lines="none">
    <ion-label>¿La vivienda está habitada?</ion-label>
  </ion-item>
  <ion-radio-group [(ngModel)]="habitada">
    <ion-item><ion-radio slot="start" [value]="true"></ion-radio><ion-label>Sí</ion-label></ion-item>
    <ion-item><ion-radio slot="start" [value]="false"></ion-radio><ion-label>No</ion-label></ion-item>
  </ion-radio-group>

  <ion-item lines="none">
    <ion-label>¿Tiene contrato?</ion-label>
  </ion-item>
  <ion-radio-group [(ngModel)]="contrato">
    <ion-item><ion-radio slot="start" [value]="true"></ion-radio><ion-label>Sí</ion-label></ion-item>
    <ion-item><ion-radio slot="start" [value]="false"></ion-radio><ion-label>No</ion-label></ion-item>
  </ion-radio-group>

  <ion-item lines="none">
    <ion-label>¿Tiene medidor?</ion-label>
  </ion-item>
  <ion-radio-group [(ngModel)]="tieneMedidor">
    <ion-item><ion-radio slot="start" [value]="true"></ion-radio><ion-label>Sí</ion-label></ion-item>
    <ion-item><ion-radio slot="start" [value]="false"></ion-radio><ion-label>No</ion-label></ion-item>
  </ion-radio-group>

  <ion-item>
    <ion-label position="floating">Número del medidor</ion-label>
    <ion-input [(ngModel)]="numeroMedidor"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="floating">Número exterior</ion-label>
    <ion-input [(ngModel)]="numeroExterior"></ion-input>
  </ion-item>

  <ion-button expand="block" color="secondary" (click)="tomarFoto()">Tomar fotografía</ion-button>

  <img *ngIf="fotoBase64" [src]="fotoBase64" style="width: 100%; margin-top: 10px;" />

  <div *ngIf="latitud && longitud" class="ion-padding-top">
    <p><strong>Latitud:</strong> {{ latitud }}</p>
    <p><strong>Longitud:</strong> {{ longitud }}</p>
  </div>

 <ion-button expand="block" color="success" (click)="guardarRegistro()">
  Guardar registro
</ion-button>

</ion-content>
